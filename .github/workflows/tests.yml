name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Numerical, native and HTTP tests
        run: python3 -B -m unittest -v test_engine.py test_validation.py test_http.py
      - name: Interface model tests
        run: node tests/model.test.js
